<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XVT Shop - Đăng Ký</title>
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <img src="../images/logo.png" alt="XVT Shop Logo">
            </div>
            <div class="menu">
                <a href="index.html">Trang chủ</a>
                <a href="products.html">Sản phẩm</a>
                <a href="contact.html">Liên hệ</a>
                <a href="cart.html">Giỏ hàng</a>
                <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </header>
    <main>
        <section class="register">
            <h1>Đăng Ký</h1>
            <p>Tạo tài khoản mới</p>
            <form class="register-form" id="registerForm">
                <div class="input-box">
                    <input type="text" id="fullname" placeholder="Họ và tên" required>
                </div>
                <div class="input-box">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-box">
                    <input type="text" id="username" placeholder="Tên đăng nhập" required>
                </div>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Mật khẩu" required>
                </div>
                <div class="input-box">
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit">Đăng Ký</button>
                <p class="login-link">
                    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
                </p>
            </form>
        </section>
    </main>
    <footer>
        <div class="footer-box">
            <p>📞 Hotline: 0123 456 789</p>
            <p>📍 Địa chỉ: số 235 Hoàng Quốc Việt, phường Nghĩa Đô, Hà Nội</p>
            <p>📧 Email: xvtshop@gmail.com</p>
            <p>🌐 Facebook: XVT Shop</p>
        </div>
        <p class="gioithieu">© 2026 XVT Shop. All rights reserved.</p>
    </footer>
    <script src="../js/register.js"></script>
</body>
</html>
