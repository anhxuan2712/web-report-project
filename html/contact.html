<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XVT Shop</title>
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">
                <img src="../images/logo.png" alt="XVT Shop Logo">
            </div>

            <div class="menu">
                <a href="index.html">Trang chủ</a>
                <a href="products.html">Sản phẩm</a>
                <a href="contact.html" class="active">Liên hệ</a>
                <a href="cart.html">Giỏ hàng</a>
                <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </header>

<section class="contact">
        <h1>Liên Hệ Với Chúng Tôi</h1>
        <p>Nếu bạn có thắc mắc, hãy gửi thông tin cho chúng tôi.</p>

        <form class="contact-form">
            <div class="input-box">
                <input type="text" placeholder="Họ và tên" required>
            </div>

            <div class="input-box">
                <input type="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <input type="text" placeholder="Số điện thoại">
            </div>

            <div class="input-box">
                <textarea placeholder="Nội dung liên hệ" required></textarea>
            </div>

            <button type="submit">Gửi liên hệ</button>
        </form>
    </section>

    <footer>
        <div class="footer-box">
            <p>📞 Hotline: 0123 456 789</p>
            <p>📍 Địa chỉ: số 235 Hoàng Quốc Việt, phường Nghĩa Đô, Hà Nội</p>
            <p>📧 Email: xvtshop@gmail.com</p>
            <p>🌐 Facebook: XVT Shop</p>
        </div>
        <p class="copyright">© 2026 XVT Shop. All rights reserved.</p>
    </footer>

    <script src="../js/products.js"></script>

</body>
</html>
