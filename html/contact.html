<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XVT Shop - Liên Hệ</title>
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>

    <header>
        <div class="navbar">
            <div class="logo">
                <img src="../images/logo.png" alt="XVT Shop Logo">
            </div>

            <div class="menu">
                <a href="index.html">Trang chủ</a>
                <a href="products.html">Sản phẩm</a>
                <a href="contact.html" class="active">Liên hệ</a>
                <a href="cart.html">Giỏ hàng</a>
                <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </header>

    <main>
        <section class="contact">
            <h1>Liên Hệ Với Chúng Tôi</h1>
            <p>Nếu bạn có thắc mắc, hãy gửi thông tin cho chúng tôi.</p>

            <form class="contact-form" id="contactForm">
                <div class="input-box">
                    <input type="text" id="fullname" placeholder="Họ và tên" required>
                </div>

                <div class="input-box">
                    <input type="email" id="email" placeholder="Email" required>
                </div>

                <div class="input-box">
                    <input type="text" id="phone" placeholder="Số điện thoại" required>
                </div>

                <div class="input-box">
                    <textarea id="message" placeholder="Nội dung liên hệ" required></textarea>
                </div>

                <button type="submit">Gửi liên hệ</button>
            </form>
        </section>
         <div class="video-box">
        <video autoplay muted loop controls>
            <source src="../video/video.mp4" type="video/mp4">
        </video>
    </div>
    </main>

    <footer>
        <div class="footer-box">
            <p>📞 Hotline: 0123 456 789</p>
            <p>📍 Địa chỉ: số 235 Hoàng Quốc Việt, phường Nghĩa Đô, Hà Nội</p>
            <p>📧 Email: xvtshop@gmail.com</p>
            <p>🌐 Facebook: XVT Shop</p>
        </div>
        <p class="copyright">© 2026 XVT Shop. All rights reserved.</p>
    </footer>

    <script src="../js/contact.js"></script>
</body>
</html>
