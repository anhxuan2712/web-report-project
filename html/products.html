<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XVT Shop - Products</title>
    <link rel="stylesheet" href="../css/products.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="navbar">
            <div class="logo">
                <h2>XVT Shop</h2>
            </div>

            <div class="menu">
                <a href="index.html">Home</a>
                <a href="products.html" class="active">Products</a>
                <a href="contact.html">Contact</a>
                <a href="cart.html">Cart</a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </header>

    <!-- PRODUCTS SECTION -->
    <section class="products-section">
        <h1>Danh sách sản phẩm</h1>

        <!-- Search -->
        <div class="search-box">
            <input 
                type="text" 
                id="searchBox" 
                placeholder="Tìm kiếm sản phẩm..." 
                onkeyup="searchProducts()">
        </div>

        <!-- Filter -->
        <div class="filter-buttons">
            <button onclick="filterProducts('all')">Tất cả</button>
            <button onclick="filterProducts('phone')">Điện thoại</button>
            <button onclick="filterProducts('laptop')">Laptop</button>
            <button onclick="filterProducts('tablet')">Tablet</button>
            <button onclick="filterProducts('watch')">Đồng hồ</button>
        </div>

        <!-- Product list -->
        <div id="product-list" class="product-grid"></div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="footer-box">
            <p>📞 Hotline: 0123 456 789</p>
            <p>📧 Email: xvtshop@gmail.com</p>
            <p>📍 Address: Hà Nội, Việt Nam</p>
        </div>
        <p class="copyright">© 2026 XVT Shop. All rights reserved.</p>
    </footer>

    <script src="../js/products.js"></script>
</body>
</html>
